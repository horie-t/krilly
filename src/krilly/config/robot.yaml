# 車体の物理パラメータ (SI 単位: m)
# 出典: ハードウェア構成
#   オムニホイール 直径48mm / 幅25.5mm / 3個
#   ステッピングモーター ステップ角1.8° (=200 step/rev)

# 実効径 (公称48mm)。実機で校正済み (#11, scripts/calibrate --straight)。
# #17 で迷路上を 2 セル走らせて実測との比で 2 段階に修正 (旧筐体・嵌め合わせ床):
#   0.04629 -> 0.04732 (実測 368mm / オドメトリ 360mm, +2.2%)
#   0.04732 -> 0.04771 (実測 363mm / オドメトリ 360mm, +0.8%)
# 筐体改修 (モータドライバを上へ、ホイール配置変更) 後に再測定。4 セル直進 720mm 指令
# に対する床のテープ印からの実測を 3 回:
#   径 0.04771 -> 707mm (実効径 0.04685)   ※初回のみ外れ値
#   径 0.04685 -> 727mm (実効径 0.04731)
#   径 0.04708 -> 724mm (実効径 0.04734)
# 後 2 回が一致するので平均 0.04732 を採用。カメラ実測 (cell_pose の前後差分) は
# 定規と 2.4mm 以内で一致するので、以後は定規なしで検証できる。
# 迷路のピッチは実測で正確に 180mm (柱 6 本 = 5 セルで 900mm) なので、迷路側ではなく
# 機体側の変化。
wheel_diameter_m: 0.04732
wheel_count: 3
steps_per_rev: 200

# マイクロステップ分割数 (L6470 STEP_MODE)。1/16 を初期値とする。
microstep: 16

# 中心から各輪の接地点までの距離 L [m]。
# 実機で校正済み (#11, scripts/calibrate --rotate)。
# #17: wheel_diameter_m を上げたのに合わせて同率で上げた (0.04595 -> 0.04737)。
# --rotate は当時の径を前提に L を出しているため、径だけ変えると L/径 の比が崩れて
# 旋回の指令角速度がずれる。同率で上げれば比が保たれ、旋回の挙動は変わらない
# (旋回はジャイロで閉じているので精度自体は径・L に依存しない)。
#
# 筐体改修でホイール配置が変わったため、径とは独立に**実測**した (0.04737 -> 0.04507)。
# 測り方 (定規不要): 定常回転させ、指令 omega とジャイロ実測 omega の比から
#   L_actual = L_cfg * omega_cmd / omega_actual
# 指令は各輪へ v_i = L_cfg*omega を出すので、実際の回転は L_actual に反比例する。
# 4 回測定 0.04495/0.04530/0.04508/0.04495、ばらつき 0.4%。
# **ハードウェアが変わったときは同率スケールではなく測り直すこと。**
center_to_wheel_m: 0.04507

# 各輪の「スポーク角」(車輪位置の角度) [deg]。120°対称配置。
# 運動学の式 v_i = -sin(theta_i)*vx + cos(theta_i)*vy + L*omega は、theta_i に
# このスポーク角を入れると正しく動く (駆動方向 = スポーク角 + 90°)。
# M0=前(spoke 0°, 駆動+y) / M1=後左(120°) / M2=後右(240°)。docs/coordinate-frames.md 参照。
# 実機で校正済み (#11): drive_demo で +x=前進 / +y=左 / +omega=CCW を確認。
#
# 筐体改修後、前進指令だけで機体が斜めに進む (クラブ走行) ようになったため、三輪の
# 取付角の実測値へ補正した。4 セル直進 720mm で機体は東へ 22mm (定規: 西壁との隙間
# 24->46mm、カメラ: 左右オフセット -21.2mm) 動いた -> atan(21.6/720) = 1.72°。
# スポーク角が一様に delta 回っていると、前進指令 vx に対し vy = vx*sin(delta) の
# 横成分が出る (方位はジャイロで保持されるので「斜めに平行移動」になる)。
# config を実測の取付角に合わせれば打ち消せる。
#
# #21 で -1.72 は行き過ぎと判明し、-0.42 へ戻した (差 +1.30°)。M5 の測り方は
# **置いたときの傾きと走行中の回転を差し引いていなかった**のが誤りで、機体側の
# クラブとカメラから見た横流れを同一視していた。正しくは
#   横流れ = 720mm * sin(置いた傾き + 走行中の回転/2 + クラブ角)
# で、置いた傾きは axis_yaw の before、走行中の回転はカメラの前後差から取れる。
# **測り直すときは必ず --camera-yaw を併用して置き方の傾きを分離すること。**
#
# ただし #21 の測定は W0 のハブ (六角) が緩んだ状態で取っていた (#72)。W0 は
# スポーク角がほぼ 0° = 駆動方向が真横なので、その緩みは横流れの測定を直接汚す。
# ネジを締めてから測り直すとクラブ角は -1.58 / -1.53° (幅 0.05°、修理前は幅 1.2°)
# と初めて再現した。
#
# -1.20 を試して 2 点が揃った (どちらも 4 セル直進 2 本):
#   config -0.42 -> クラブ角 -1.583 / -1.537° (平均 -1.560、幅 0.046)
#   config -1.20 -> クラブ角 -0.410 / -0.425° (平均 -0.418、幅 0.015)
# 傾きは -1.46 (理論の -1 とは合わない。三輪の取付角の誤差が一様な回転ではなく、
# 輪ごとに違うためと思われる)。外挿すると δ=0 は -1.485 なので **-1.49** を採る。
# 移動量が 0.29° と小さいので、傾きを -1 / -1.46 / -2 のどれで仮定しても
# 残るクラブ角は -0.13 〜 +0.16° に収まり、モデルの不確かさに対して頑健。
#
# **注意: スポーク角を動かすと前進のスケールも動く。** config を変えると W1/W2 の
# 指令速度が 0.8% 非対称に変わる (W1 -0.8694->-0.8763、W2 +0.8624->+0.8554) が、
# 推定器は同じ行列で戻すので「同じ vx」と思い込む。実際の前進量は真の取付角次第で
# ずれる。実測でも -0.42 -> -1.20 の変更で 4 セルの前後誤差が +2 -> -11mm 動いた
# (0.8% x 720mm = 5.8mm と桁が合う)。クラブ角を詰めたら wheel_diameter_m を
# 測り直すこと。
wheel_angles_deg: [-1.49, 118.51, 238.51]

# BNO055 ジャイロ z のスケール補正 (読み値 * この値 = 実際の角速度)。1.0 で補正なし。
# カメラの軸角実測 (perception/axis_yaw) と比べて校正する:
#   scripts/cell_move_demo --seq L,L,L,L --camera-yaw
#   新しい値 = 現在の値 * (実測した真の回転量 / 推定した回転量)
# #17: 0.984 (360°で +1.61% 過大)
# IMU の取付が緩んでいたのを締め直したら +3.3% 過大になった (360°で -6.1°、3回測定の
# ばらつき 0.3%)。傾いていると読み値が cos(傾き) 倍に減り、スケール誤差を隠していた
# (3.3% x cos10° ≒ 1.7% が以前の測定値と一致する)。**IMU を触ったら必ず測り直す**。
gyro_scale_z: 0.970
